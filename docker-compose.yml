services:
  cold-outreach:
    image: cold-outreach-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cold-outreach-pipeline
    user: "root"
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Mount data folder to persist csv data and emailed logs
      - ./data:/app/data
      # Mount secrets (token needs write access to auto-refresh)
      - ./.env:/app/.env:ro
      - ./token.json:/app/token.json
    deploy:
      resources:
        limits:
          # Limit memory to 1GB to protect the 3.8GB host VPS from OOM crashes via Chrome
          memory: 1G
        reservations:
          memory: 256M

