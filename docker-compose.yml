services:
  cold-outreach:
    image: cold-outreach-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cold-outreach-pipeline
    user: "root"
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Poll the persisted Eastern-time schedule once per minute.
      AUTO_PIPELINE_CHECK_SECONDS: "60"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    volumes:
      # Mount data folder to persist csv data and emailed logs
      - ./data:/app/data
      # Mount logs so background automation and Streamlit logs survive restarts
      - ./logs:/app/logs
      # Mount secrets (token needs write access to auto-refresh)
      - ./.env:/app/.env:ro
      - ./token.json:/app/token.json
      - ./token2.json:/app/token2.json
    deploy:
      resources:
        limits:
          # Limit memory to 1GB to protect the 3.8GB host VPS from OOM crashes via Chrome
          memory: 1G
        reservations:
          memory: 256M
